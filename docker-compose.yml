# Metabase pour les tableaux de bord Odoo Community
# Démarrage : docker compose up -d   puis ouvrir http://localhost:3000

services:
  # Base interne de Metabase (questions, tableaux de bord, utilisateurs).
  # Séparée de la base Odoo : Metabase n'écrit jamais dans Odoo.
  metabase-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabase
      POSTGRES_USER: metabase
      POSTGRES_PASSWORD: ${METABASE_DB_PASSWORD:?à définir dans .env}
    volumes:
      - metabase-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabase -d metabase"]
      interval: 10s
      timeout: 5s
      retries: 5

  metabase:
    image: metabase/metabase:v0.64.5.2
    restart: unless-stopped
    depends_on:
      metabase-db:
        condition: service_healthy
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: metabase-db
      MB_DB_PORT: 5432
      MB_DB_DBNAME: metabase
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_DB_PASSWORD}
      JAVA_TIMEZONE: ${TZ:-Europe/Paris}
    # Permet de joindre un PostgreSQL Odoo installé sur la machine hôte
    # via l'adresse host.docker.internal.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 60s

volumes:
  metabase-db-data:
